<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="100%" height="100%">
  <defs>
    <!-- Shadow blur -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    
    <!-- Egg gradient for 3D effect -->
    <radialGradient id="eggGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#f0c29f" />
      <stop offset="50%" stop-color="#db9c71" />
      <stop offset="90%" stop-color="#b87349" />
      <stop offset="100%" stop-color="#915230" />
    </radialGradient>
    
    <!-- Cap gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4eee4" />
      <stop offset="100%" stop-color="#e2d5c3" />
    </linearGradient>

    <!-- Pom-pom gradient -->
    <radialGradient id="pomGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4eee4" />
      <stop offset="100%" stop-color="#d6c6b0" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="225" rx="45" ry="12" fill="rgba(60, 20, 10, 0.4)" filter="url(#shadowBlur)" />
  <ellipse cx="100" cy="225" rx="25" ry="6" fill="rgba(60, 20, 10, 0.6)" filter="url(#shadowBlur)" />

  <!-- Egg Body -->
  <ellipse cx="100" cy="130" rx="65" ry="85" fill="url(#eggGrad)" />
  
  <!-- Texture Overlay (subtle dots) -->
  <g opacity="0.05">
    <circle cx="80" cy="120" r="1" fill="#000" />
    <circle cx="110" cy="140" r="1.5" fill="#000" />
    <circle cx="95" cy="160" r="1" fill="#000" />
    <circle cx="130" cy="110" r="1.2" fill="#000" />
    <circle cx="70" cy="150" r="1" fill="#000" />
    <circle cx="120" cy="170" r="1.5" fill="#000" />
    <circle cx="60" cy="110" r="1" fill="#000" />
    <circle cx="100" cy="100" r="1.2" fill="#000" />
  </g>

  <!-- Sleeping Eyes -->
  <path d="M75,135 Q83,143 91,135" fill="none" stroke="#29231d" stroke-width="3" stroke-linecap="round" />
  <path d="M110,135 Q118,143 126,135" fill="none" stroke="#29231d" stroke-width="3" stroke-linecap="round" />

  <!-- Night Cap Base (Wraps around top of egg) -->
  <path d="M38,80 Q100,20 162,80 Q155,100 145,102 Q100,85 45,95 Q35,88 38,80 Z" fill="url(#capGrad)" />
  
  <!-- Night Cap Fold/Brim -->
  <path d="M35,85 Q100,70 165,85 C170,92 165,105 155,107 Q100,90 40,105 C30,105 30,92 35,85 Z" fill="url(#capGrad)" stroke="#e2d5c3" stroke-width="1" />
  <path d="M35,88 Q100,73 165,88" fill="none" stroke="#e2d5c3" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M38,94 Q100,79 162,94" fill="none" stroke="#e2d5c3" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Night Cap Tail (Drooping down to the left) -->
  <path d="M50,85 C40,70 15,65 25,100 C30,110 40,105 45,95" fill="url(#capGrad)" />
  
  <!-- Pom-pom on the tail -->
  <circle cx="20" cy="105" r="14" fill="url(#pomGrad)" />
  
  <!-- Pom-pom fluff details -->
  <circle cx="12" cy="102" r="4" fill="url(#pomGrad)" />
  <circle cx="28" cy="108" r="4.5" fill="url(#pomGrad)" />
  <circle cx="18" cy="117" r="4" fill="url(#pomGrad)" />
  <circle cx="25" cy="95" r="4.5" fill="url(#pomGrad)" />
  <circle cx="15" cy="93" r="3" fill="url(#pomGrad)" />

</svg>
